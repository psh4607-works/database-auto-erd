name: database-auto-erd
services:
  app:
    build: .
    ports:
      - "127.0.0.1:3400:3000"
    restart: unless-stopped
    volumes:
      - workspace:/data
    secrets:
      - credential_key
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      start_period: 30s
    security_opt:
      - no-new-privileges:true
volumes:
  workspace:
secrets:
  credential_key:
    file: ./.local/credential-key
